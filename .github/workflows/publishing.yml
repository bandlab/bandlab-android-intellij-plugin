name: Publish

on:
  release:
    types: [released]
  # Manual (re-)publish, e.g. a version released before Maven Central publishing existed, or a
  # retry after a failed release run.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish; must match pluginVersion in gradle.properties on the selected ref'
        required: true
        type: string
      publish-maven-central:
        description: 'Publish to Maven Central; untick to only update the plugin index for a version already there'
        required: false
        type: boolean
        default: true

# The job only reads the repo; credentials come from secrets.
permissions:
  contents: read

# Never let two publishes race for the same coordinates.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    env:
      # JetBrains plugin signing (signPlugin)
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    name: Build and Publish
    if: ${{ github.event_name == 'release' || inputs.publish-maven-central }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JVM
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true

      # Maven Central releases are immutable, so make sure the release tag (or the manual
      # `version` input) matches the version being built before uploading anything.
      - name: Verify version
        env:
          # Pass untrusted values via env, not `${{ }}` interpolation, so a tag with shell
          # metacharacters cannot inject into the script.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(./gradlew properties --console=plain -q | grep "^version:" | cut -f2- -d ' ')"
          EXPECTED="${INPUT_VERSION:-$RELEASE_TAG}"
          EXPECTED="${EXPECTED#v}"
          if [ "$EXPECTED" != "$VERSION" ]; then
            echo "::error::Requested version '$EXPECTED' does not match pluginVersion '$VERSION' in gradle.properties."
            exit 1
          fi
          echo "Publishing $VERSION"

      # Fail fast with a named secret instead of an opaque 401 or an unsigned release.
      - name: Verify credentials
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
        run: |
          for name in CERTIFICATE_CHAIN PRIVATE_KEY MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name must be set."
              exit 1
            fi
          done

      # A wrong passphrase fails later as an opaque BouncyCastle "checksum mismatch".
      # Verify it here, and strip CR / trailing newline that copy-paste or
      # `echo ... | gh secret set` can introduce into the key or password.
      - name: Verify signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          KEY=$(printf '%s' "$SIGNING_KEY" | tr -d '\r')
          PASS=$(printf '%s' "$SIGNING_PASSWORD" | tr -d '\r\n')
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$KEY" | gpg --batch --import >/dev/null 2>&1
          if ! printf 'verify' | gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$PASS" --sign -o /dev/null - >/dev/null 2>&1; then
            echo "::error::SIGNING_IN_MEMORY_KEY or SIGNING_IN_MEMORY_KEY_PASSWORD is invalid (bad passphrase or corrupted key)."
            exit 1
          fi
          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<__SIGNING_KEY__"
            printf '%s\n' "$KEY"
            echo "__SIGNING_KEY__"
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=$PASS"
          } >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache

      - name: Collect Verification Failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pluginVerifier-failure
          path: ${{ github.workspace }}/build/reports/problems

  # Developers' IDEs use the custom plugin repository on Artifactory
  # (https://artifactory.bandlab.cloud/artifactory/intellij-idea-plugins/updatePlugins.xml).
  # Keep that index, but point the new version's download URL at the zip on Maven Central.
  update-plugin-index:
    name: Update plugin index
    needs: build-and-publish
    # Also run when the Maven Central upload was skipped on a manual run.
    if: ${{ !cancelled() && needs.build-and-publish.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      INDEX_URL: https://artifactory.bandlab.cloud/artifactory/intellij-idea-plugins/updatePlugins.xml
      ARTIFACTORY_USERNAME: ${{ secrets.PUBLISH_USER }}
      ARTIFACTORY_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify version and credentials
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(sed -n 's/^pluginVersion[[:space:]]*=[[:space:]]*//p' gradle.properties)"
          EXPECTED="${INPUT_VERSION:-$RELEASE_TAG}"
          EXPECTED="${EXPECTED#v}"
          if [ "$EXPECTED" != "$VERSION" ]; then
            echo "::error::Requested version '$EXPECTED' does not match pluginVersion '$VERSION' in gradle.properties."
            exit 1
          fi
          if [ -z "$ARTIFACTORY_USERNAME" ] || [ -z "$ARTIFACTORY_PASSWORD" ]; then
            echo "::error::PUBLISH_USER and PUBLISH_PASSWORD secrets must both be set."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Central syncs to repo1 some minutes after the deployment is published. Don't point the
      # index at the zip before developers can download it.
      - name: Wait for the zip on Maven Central
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://repo1.maven.org/maven2/com/bandlab/bandlab-android-intellij-plugin/$VERSION/bandlab-android-intellij-plugin-$VERSION.zip"
          for attempt in $(seq 1 120); do
            if curl -fsSL -o plugin.zip "$URL"; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Not on Maven Central yet ($attempt/120), retrying in 30s..."
            sleep 30
          done
          echo "::error::$URL is still not available after 60 minutes."
          exit 1

      - name: Update and upload the index
        env:
          DOWNLOAD_URL: ${{ steps.zip.outputs.url }}
        run: |
          curl -fsSL -o current.xml "$INDEX_URL"
          python3 -I .github/scripts/update_plugin_index.py plugin.zip "$DOWNLOAD_URL" current.xml updatePlugins.xml
          curl -fsS -u "$ARTIFACTORY_USERNAME:$ARTIFACTORY_PASSWORD" -T updatePlugins.xml "$INDEX_URL" > /dev/null
          echo "Uploaded $INDEX_URL"
